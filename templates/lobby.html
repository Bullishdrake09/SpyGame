<!DOCTYPE html>
<html>
<head>
  <title>Spy Game (Beta) - Lobby</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" id="theme-stylesheet">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <style>
    .chat-section {
  margin-top: 20px;
  padding: 15px;
  background-color: #1a1a1a;
  border: 1px solid #c40000;
  border-radius: 6px;
}
.chat-box {
  height: 150px;
  overflow-y: auto;
  border: 1px solid #333;
  padding: 10px;
  background-color: #111;
  color: #fff;
  margin-bottom: 10px;
  max-width: 500px; /* Wider chat box */
}
.chat-box p {
  margin: 5px 0;
  word-wrap: break-word;
  white-space: pre-wrap;
}
.chat-input {
  display: flex;
}
.chat-input input {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 4px 0 0 4px;
}
.chat-input button {
  padding: 8px 16px;
  border: none;
  background-color: #c40000;
  color: white;
  border-radius: 0 4px 4px 0;
  cursor: pointer;
}
.chat-input button:hover {
  background-color: #ff0000;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Spy Game - Lobby</h1>
    
    <div class="theme-selector">
      <span>Theme:</span>
      <button id="defaultTheme" class="theme-button active">Default</button>
      <button id="purpleTheme" class="theme-button">Purple</button>
    </div>
    
    <div class="lobby-details">
      <h2>Game Details</h2>
      <p>Lobby Code: <strong>{{ lobby_code }}</strong></p>
      <p>Your Nickname: <strong>{{ nickname }}</strong></p>
      <p>Your Role: <strong>{{ "Host" if is_host else "Player" }}</strong></p>
    </div>
    
    <div class="players-list">
      <h2>Players</h2>
      <div id="players-container">
        <!-- Players will be dynamically added here -->
        <p>Waiting for players to join...</p>
      </div>
    </div>
    
    {% if is_host %}
    <div class="host-controls">
      <button id="start-game">Start Game</button>
    </div>
    {% endif %}
  </div>

  <div class="chat-section">
    <h2>Chat</h2>
    <div id="chat-messages" class="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="chat-input" placeholder="Type a message..." />
      <button id="send-chat">Send</button>
    </div>
  </div>


  <script>
    var socket = io();
    var isHost = {{ 'true' if is_host else 'false' }};
    var myNick = "{{ nickname }}";
    
    // Connect to socket and join lobby
    socket.on('connect', function() {
      socket.emit('join_lobby');
    });
    
    // Update players list when receiving player data
    socket.on('update_players', function(data) {
      var container = document.getElementById('players-container');
      container.innerHTML = '';
      
      data.players.forEach(function(player) {
        var playerItem = document.createElement('div');
        playerItem.className = 'player-item';
        
        var nameSpan = document.createElement('span');
        nameSpan.innerText = player.nickname + (player.points > 0 ? ' (' + player.points + ' pts)' : '');
        playerItem.appendChild(nameSpan);
        
        // Add kick button for host (but can't kick self)
        if(isHost && player.nickname !== myNick) {
          var kickBtn = document.createElement('button');
          kickBtn.className = 'kick-button';
          kickBtn.innerText = 'Kick';
          kickBtn.onclick = function() {
            socket.emit('kick_player', { sid: player.sid });
          };
          playerItem.appendChild(kickBtn);
        }
        
        container.appendChild(playerItem);
      });
    });
    
    // Error handling
    socket.on('error', function(data) {
      alert(data.message);
    });
    
    // Handle game start
    if(isHost) {
      document.getElementById('start-game').addEventListener('click', function() {
        socket.emit('start_game');
      });
    }
    
    // Handle redirect to game page
    socket.on('game_started', function() {
      window.location.href = '/game';
    });
    
    // Handle getting kicked
    socket.on('kicked', function(data) {
      alert(data.message);
      window.location.href = '/';
    });

    // Theme switching functionality
    document.getElementById('defaultTheme').addEventListener('click', function() {
      setTheme('style.css');
      setActiveThemeButton(this);
    });

    document.getElementById('purpleTheme').addEventListener('click', function() {
      setTheme('purple.css');
      setActiveThemeButton(this);
    });

    function setTheme(cssFile) {
      // Get the existing stylesheet link
      let link = document.getElementById('theme-stylesheet');
      // Update the href to the new CSS file
      link.href = "{{ url_for('static', filename='css/') }}" + cssFile;
      
      // Save the preference to localStorage so it persists between page loads
      localStorage.setItem('preferredTheme', cssFile);
    }

    function setActiveThemeButton(activeButton) {
      // Remove active class from all buttons
      document.querySelectorAll('.theme-button').forEach(button => {
        button.classList.remove('active');
      });
      
      // Add active class to the clicked button
      activeButton.classList.add('active');
    }

    // Apply saved theme when page loads
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('preferredTheme');
      if (savedTheme) {
        setTheme(savedTheme);
        
        // Set the active button based on the saved theme
        if (savedTheme === 'purple.css') {
          setActiveThemeButton(document.getElementById('purpleTheme'));
        } else {
          setActiveThemeButton(document.getElementById('defaultTheme'));
        }
      }
    });


    // Send chat message
    document.getElementById('send-chat').addEventListener('click', function () {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (message) {
            socket.emit('send_chat', { message: message });
            input.value = '';
        }
    });

    // Handle Enter key
    document.getElementById('chat-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('send-chat').click();
        }
    });

    // Receive chat message
    socket.on('receive_chat', function (data) {
        const chatBox = document.getElementById('chat-messages');
        const messageEl = document.createElement('p');
        messageEl.innerHTML = `<strong>${data.nickname}</strong> <small>(${data.timestamp})</small>: ${data.message}`;
        chatBox.appendChild(messageEl);
        chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll
    });
  </script>
</body>
</html>
