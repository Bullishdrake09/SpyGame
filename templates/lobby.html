<!DOCTYPE html>
<html>
<head>
  <title>Spy Game (Beta) - Lobby</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" id="theme-stylesheet">
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <style>
    .chat-section {
      margin-top: 20px;
      padding: 15px;
      background-color: #1a1a1a;
      border: 1px solid #c40000;
      border-radius: 6px;
    }
    
    .chat-box {
      height: 150px;
      overflow-y: auto;
      border: 1px solid #333;
      padding: 10px;
      background-color: #111;
      color: #fff;
      margin-bottom: 10px;
      max-width: 500px;
    }
    
    .chat-box p {
      margin: 5px 0;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    
    .chat-input {
      display: flex;
    }
    
    .chat-input input {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 4px 0 0 4px;
      max-width: 400px;
    }
    
    .chat-input button {
      padding: 8px 16px;
      border: none;
      background-color: #c40000;
      color: white;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    
    .chat-input button:hover {
      background-color: #ff0000;
    }
    
    #toast {
      visibility: hidden;
      min-width: 150px;
      background: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 10px;
      position: fixed;
      z-index: 1000;
      left: 50%;
      bottom: 30px;
      margin-left: -75px;
      opacity: 0;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #toast.show {
      visibility: visible;
      opacity: 1;
    }

    .kick-button {
      background-color: #ff4444;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .kick-button:hover {
      background-color: #ff0000;
    }

    .player-item {
      padding: 12px;
      border-bottom: 1px solid #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s ease;
    }

    .player-item:hover {
      background: #330000;
    }

    .connection-status {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }

    .connection-status.connected {
      background-color: #00ff00;
    }

    .connection-status.disconnected {
      background-color: #ff0000;
    }

    .error-message {
      background-color: #ff4444;
      color: white;
      padding: 10px;
      border-radius: 4px;
      margin: 10px 0;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    #start-game:disabled {
      background-color: #555;
      cursor: not-allowed;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Spy Game - Lobby</h1>
    
    <div class="theme-selector">
      <span>Theme:</span>
      <button id="defaultTheme" class="theme-button active">Default</button>
      <button id="purpleTheme" class="theme-button">Purple</button>
      <button id="cyberpunkTheme" class="theme-button">Cyberpunk</button>
      <button id="blueTheme" class="theme-button">Blue</button>
      <button id="matrixTheme" class="theme-button">Matrix</button>
      <button id="pinkTheme" class="theme-button">Pink</button>
    </div>
    
    <div class="lobby-details">
      <h2>Game Details</h2>
      <p>Lobby Code: <strong>{{ lobby_code }}</strong></p>
      <p>Your Nickname: <strong>{{ nickname }}</strong></p>
      <p>Your Role: <strong>{{ "Host" if is_host else "Player" }}</strong></p>
      <p><span class="connection-status connected" id="connection-status"></span> <span id="connection-text">Connected</span></p>
    </div>

    <div class="error-message" id="error-message"></div>
    
    <div class="players-list">
      <h2>Players (<span id="player-count">0</span>)</h2>
      <div id="players-container">
        <p>Waiting for players to join...</p>
      </div>
    </div>
    
    {% if is_host %}
    <div class="host-controls">
      <button id="start-game" disabled>Start Game (Need at least 3 players)</button>
    </div>
    {% endif %}

    <div id="Linksharebutton">
      <button onclick="copyLink()" class="share-button">Share Link</button>
    </div>

    <div class="chat-section">
      <h2>Chat</h2>
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="chat-input" placeholder="Type a message..." maxlength="500" />
        <button id="send-chat">Send</button>
      </div>
    </div>

    <div id="toast">Link copied!</div>
  </div>

  <script>
    const socket = io();
    const isHost = {{ 'true' if is_host else 'false' }};
    const myNick = "{{ nickname }}";
    let playerCount = 0;
    
    // DOM elements
    const playersContainer = document.getElementById('players-container');
    const playerCountEl = document.getElementById('player-count');
    const startGameBtn = document.getElementById('start-game');
    const errorMessageEl = document.getElementById('error-message');
    const connectionStatus = document.getElementById('connection-status');
    const connectionText = document.getElementById('connection-text');
    const chatInput = document.getElementById('chat-input');
    const sendChatBtn = document.getElementById('send-chat');
    const chatMessages = document.getElementById('chat-messages');

    // Connect to socket
    socket.on('connect', function() {
      console.log('Connected to server');
      updateConnectionStatus(true);
      socket.emit('join_lobby');
    });

    socket.on('disconnect', function() {
      console.log('Disconnected from server');
      updateConnectionStatus(false);
      showError('Disconnected from server. Attempting to reconnect...');
    });

    socket.on('connect_error', function(error) {
      console.error('Connection error:', error);
      updateConnectionStatus(false);
      showError('Connection error. Please refresh the page.');
    });

    function updateConnectionStatus(connected) {
      if (connectionStatus && connectionText) {
        if (connected) {
          connectionStatus.classList.remove('disconnected');
          connectionStatus.classList.add('connected');
          connectionText.textContent = 'Connected';
        } else {
          connectionStatus.classList.remove('connected');
          connectionStatus.classList.add('disconnected');
          connectionText.textContent = 'Disconnected';
        }
      }
    }

    function showError(message) {
      if (errorMessageEl) {
        errorMessageEl.textContent = message;
        errorMessageEl.classList.add('show');
        setTimeout(() => {
          errorMessageEl.classList.remove('show');
        }, 5000);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Update players list
    socket.on('update_players', function(data) {
      if (!playersContainer) return;
      
      playersContainer.innerHTML = '';
      playerCount = data.players ? data.players.length : 0;
      
      if (playerCountEl) {
        playerCountEl.textContent = playerCount;
      }
      
      if (playerCount === 0) {
        playersContainer.innerHTML = '<p>Waiting for players to join...</p>';
      } else {
        data.players.forEach(function(player) {
          const playerItem = document.createElement('div');
          playerItem.className = 'player-item';
          
          const nameSpan = document.createElement('span');
          nameSpan.innerText = escapeHtml(player.nickname) + 
            (player.points > 0 ? ' (' + player.points + ' pts)' : '');
          playerItem.appendChild(nameSpan);
          
          // Add kick button for host (but can't kick self)
          if (isHost && player.nickname !== myNick) {
            const kickBtn = document.createElement('button');
            kickBtn.className = 'kick-button';
            kickBtn.innerText = 'Kick';
            kickBtn.onclick = function() {
              if (confirm(`Are you sure you want to kick ${player.nickname}?`)) {
                socket.emit('kick_player', { sid: player.sid });
              }
            };
            playerItem.appendChild(kickBtn);
          }
          
          playersContainer.appendChild(playerItem);
        });
      }

      // Update start button state for host
      if (isHost && startGameBtn) {
        if (playerCount >= 3) {
          startGameBtn.removeAttribute('disabled');
          startGameBtn.textContent = 'Start Game';
        } else {
          startGameBtn.setAttribute('disabled', 'true');
          startGameBtn.textContent = `Start Game (Need ${3 - playerCount} more player${3 - playerCount > 1 ? 's' : ''})`;
        }
      }
    });
    
    // Error handling
    socket.on('error', function(data) {
      showError(data.message || 'An error occurred');
    });
    
    // Handle game start
    if (isHost && startGameBtn) {
      startGameBtn.addEventListener('click', function() {
        if (playerCount >= 3) {
          startGameBtn.setAttribute('disabled', 'true');
          startGameBtn.textContent = 'Starting...';
          socket.emit('start_game');
        }
      });
    }
    
    // Handle redirect to game page
    socket.on('game_started', function() {
      window.location.href = '/game';
    });
    
    // Handle getting kicked
    socket.on('kicked', function(data) {
      alert(data.message || 'You have been kicked from the lobby.');
      window.location.href = '/';
    });

    // Chat functionality
    if (sendChatBtn && chatInput) {
      sendChatBtn.addEventListener('click', function() {
        sendMessage();
      });

      chatInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          sendMessage();
        }
      });
    }

    function sendMessage() {
      if (!chatInput) return;
      
      const message = chatInput.value.trim();
      if (message && message.length > 0 && message.length <= 500) {
        socket.emit('send_chat', { message: message });
        chatInput.value = '';
      }
    }

    socket.on('receive_chat', function(data) {
      if (!chatMessages) return;
      
      const messageEl = document.createElement('p');
      messageEl.innerHTML = `<strong>${escapeHtml(data.nickname)}</strong> <small>(${escapeHtml(data.timestamp)})</small>: ${escapeHtml(data.message)}`;
      chatMessages.appendChild(messageEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    // Share link functionality
    async function copyLink() {
      const code = '{{ lobby_code }}';
      const link = window.location.origin + '/link/' + code;

      try {
        await navigator.clipboard.writeText(link);
        
        const toast = document.getElementById('toast');
        if (toast) {
          toast.classList.add('show');
          setTimeout(() => {
            toast.classList.remove('show');
          }, 3000);
        }
      } catch (err) {
        console.error('Failed to copy link:', err);
        // Fallback for older browsers
        const textArea = document.createElement('textarea');
        textArea.value = link;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          const toast = document.getElementById('toast');
          if (toast) {
            toast.classList.add('show');
            setTimeout(() => {
              toast.classList.remove('show');
            }, 3000);
          }
        } catch (err2) {
          alert('Failed to copy link. Please copy manually: ' + link);
        }
        document.body.removeChild(textArea);
      }
    }

    // Theme switching
    const themeButtons = {
      'defaultTheme': 'style.css',
      'purpleTheme': 'purple.css',
      'cyberpunkTheme': 'cyberpunk.css',
      'blueTheme': 'blue.css',
      'matrixTheme': 'matrix.css',
      'pinkTheme': 'pink.css'
    };

    Object.keys(themeButtons).forEach(buttonId => {
      const button = document.getElementById(buttonId);
      if (button) {
        button.addEventListener('click', function() {
          setTheme(themeButtons[buttonId]);
          setActiveThemeButton(this);
        });
      }
    });

    function setTheme(cssFile) {
      const link = document.getElementById('theme-stylesheet');
      if (link) {
        link.href = "{{ url_for('static', filename='css/') }}" + cssFile;
        localStorage.setItem('preferredTheme', cssFile);
      }
    }

    function setActiveThemeButton(activeButton) {
      document.querySelectorAll('.theme-button').forEach(button => {
        button.classList.remove('active');
      });
      if (activeButton) {
        activeButton.classList.add('active');
      }
    }

    // Load saved theme on page load
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('preferredTheme');
      if (savedTheme) {
        setTheme(savedTheme);
        
        const themeButtonMap = {
          'style.css': 'defaultTheme',
          'purple.css': 'purpleTheme',
          'cyberpunk.css': 'cyberpunkTheme',
          'blue.css': 'blueTheme',
          'matrix.css': 'matrixTheme',
          'pink.css': 'pinkTheme'
        };
        
        const buttonId = themeButtonMap[savedTheme];
        const button = document.getElementById(buttonId);
        if (button) {
          setActiveThemeButton(button);
        }
      } else {
        setActiveThemeButton(document.getElementById('defaultTheme'));
      }
    });
  </script>
</body>
</html>
