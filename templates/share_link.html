<!-- templates/share_link.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Join Lobby</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    form {
      display: inline-block;
      text-align: left;
    }
    input[type="text"] {
      padding: 10px;
      width: 300px;
      margin-bottom: 10px;
    }
    button {
      background-color: #c40000;
      color: white;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #ff0000;
    }
  </style>
</head>
<body>
  <h2>Join Lobby "{{ code }}"</h2>
  <form action="/join" method="post">
    <input type="text" name="nickname" placeholder="Enter your nickname" required />
    <input type="hidden" name="lobby_code" value="{{ code }}" />
    <br />
    <button type="submit">Join</button>
  </form>
</body>
</html>
